# ---------------------------------------------------------------- autonomous CERN job workflow (requested 2026-10-10)
- task_id: WF-001
  title: "Design the autonomous CERN job runner (ticket -> HTCondor DAG -> results pushed to GitHub)"
  owner: claude
  reviewer: codex
  priority: 1
  requirements:
    - "a job is requested by a ticket: a YAML spec in a private jobs repo; it runs only after Mahmoud merges it to main (approval)"
    - "nothing depends on the laptop after the merge: an acron entry on lxplus polls the repo, validates, submits and collects"
    - "each job is an HTCondor DAG of <= 20 h segments with restart, so every segment starts with fresh Kerberos/EOS credentials"
    - "small outputs (summaries, energies, DOS, plots) pushed to GitHub by the runner; heavy files stay on EOS with their path recorded"
    - "only whitelisted templates (no arbitrary shell from specs); caps on cores, memory, concurrent jobs; no new long jobs after 16 Oct; hard stop 20 Oct"
    - "GitHub write access from CERN only through a deploy key limited to the jobs repo, created by Mahmoud; no password or token ever handled by an agent"
  deliverables: [claude/plans/WF-001_design.md, handoff in handoffs/CLAUDE_TO_CODEX.md]
  status: TODO

