- task_id: RQ-001
  title: "Reconcile mobility and SS with the published values"
  question: "Which definitions, C_ox, V_D and windows reproduce the paper's mu_max (27.4 / ~4 / 5.1) and SS (60-70 mV/dec), and which values are right for these devices?"
  owner: claude
  reviewer: codex
  priority: 1
  input_commit: f315b78
  allowed_data: [data/experimental_clean.csv, the published paper]
  forbidden_data: [any future holdout]
  method_outline:
    - "re-extract mu with candidate definitions: gm-based linear; mu_eff = L I_D/(W C_ox (V_G - V_FB) V_D); saturation formula; Y-function; alternative C_ox (C-V, EOT variants); alternative V_D"
    - "re-extract SS with candidate methods: two-point minimum, steepest-n-points, fixed windows; record how the result depends on the window position relative to the floor"
    - "list the questions that only the fab can answer"
  deliverables: [claude/evidence/RQ-001/ (scripts, tables, figures), handoffs/ entry, questions for HUM-001]
  result: "2026-10-09 HO-002: paper mu_max numerically reproduced by the peak of saturation-formula mobility on our curves (C030); leading candidate for the paper's method, recipe unconfirmed (C031); paper SS (Fig. 1b: 62/87/119) compatible with several near-floor estimators, method not identified (C032); six fab questions in claude/evidence/RQ-001/README.md"
  review: "2026-10-09 Codex MODIFY (codex/independent_reviews/RQ-001_review.md; phase 1 not strictly blinded). Owner response claude/responses_to_codex/RQ-001_response.md: 11 accepted, 2 partially accepted, 4 unresolved; no ledger status changes"
  status: REVIEWED (MODIFY); waiting on HUM-001 fab answers

