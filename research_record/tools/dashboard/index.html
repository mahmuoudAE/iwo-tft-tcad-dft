<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>IWO Mission Control</title>
<link rel="icon" id="favicon" href="data:,">
<!-- IWO Mission Control frontend: single self-contained page (inline CSS + vanilla JS, no external resources).
     Reads GET /api/status (polled every 30 s while visible), /api/refresh?cern=1 (Refresh button) and
     /api/history (longer sparkline ranges). All data is inserted with textContent; nothing uses innerHTML. -->
<script>try{var t=(JSON.parse(localStorage.getItem('iwo-mission-control/ui/v1')||'null')||{}).theme;if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{
  color-scheme:dark;
  --maxw:1680px;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"SF Mono",ui-monospace,Menlo,monospace;
  --bg:#0b0d10; --bg-top:rgba(12,15,19,.94); --card:#12151a; --card-2:#171b21; --hover:#1a1f26;
  --line:#232931; --line-2:#2f3640;
  --fg:#e6e9ee; --fg-2:#aeb6c1; --muted:#808a96; --accent:#6cb6ff; --focus:#79c0ff;
  --ok:#3fb950; --ok-bg:rgba(63,185,80,.14); --ok-line:rgba(63,185,80,.45);
  --run:#58a6ff; --run-bg:rgba(88,166,255,.15); --run-line:rgba(88,166,255,.55);
  --warn:#d29922; --warn-bg:rgba(210,153,34,.15); --warn-line:rgba(210,153,34,.5);
  --crit:#f85149; --crit-bg:rgba(248,81,73,.15); --crit-line:rgba(248,81,73,.55);
  --idle:#8b949e; --idle-bg:rgba(139,148,158,.13); --idle-line:rgba(139,148,158,.5);
  --info:#8fa7c7; --info-bg:rgba(143,167,199,.13); --info-line:rgba(143,167,199,.45);
  --s1:#3987e5; --s2:#d95926;
  --grid:#1f242b; --axis:#3a424d; --band:rgba(88,166,255,.09);
  --shadow:0 8px 24px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f2f4f7; --bg-top:rgba(255,255,255,.94); --card:#ffffff; --card-2:#f6f8fa; --hover:#f1f4f8;
    --line:#dfe3e8; --line-2:#cdd3da;
    --fg:#15191e; --fg-2:#424a55; --muted:#5e6773; --accent:#0969da; --focus:#0969da;
    --ok:#116329; --ok-bg:rgba(26,127,55,.10); --ok-line:rgba(26,127,55,.4);
    --run:#0969da; --run-bg:rgba(9,105,218,.09); --run-line:rgba(9,105,218,.45);
    --warn:#8a5c00; --warn-bg:rgba(191,135,0,.11); --warn-line:rgba(138,92,0,.45);
    --crit:#cf222e; --crit-bg:rgba(207,34,46,.08); --crit-line:rgba(207,34,46,.4);
    --idle:#636c76; --idle-bg:rgba(99,108,118,.10); --idle-line:rgba(99,108,118,.45);
    --info:#4b6584; --info-bg:rgba(75,101,132,.10); --info-line:rgba(75,101,132,.4);
    --s1:#2a78d6; --s2:#eb6834;
    --grid:#e8ebef; --axis:#c4cad2; --band:rgba(9,105,218,.07);
    --shadow:0 8px 24px rgba(20,30,45,.14);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f4f7; --bg-top:rgba(255,255,255,.94); --card:#ffffff; --card-2:#f6f8fa; --hover:#f1f4f8;
  --line:#dfe3e8; --line-2:#cdd3da;
  --fg:#15191e; --fg-2:#424a55; --muted:#5e6773; --accent:#0969da; --focus:#0969da;
  --ok:#116329; --ok-bg:rgba(26,127,55,.10); --ok-line:rgba(26,127,55,.4);
  --run:#0969da; --run-bg:rgba(9,105,218,.09); --run-line:rgba(9,105,218,.45);
  --warn:#8a5c00; --warn-bg:rgba(191,135,0,.11); --warn-line:rgba(138,92,0,.45);
  --crit:#cf222e; --crit-bg:rgba(207,34,46,.08); --crit-line:rgba(207,34,46,.4);
  --idle:#636c76; --idle-bg:rgba(99,108,118,.10); --idle-line:rgba(99,108,118,.45);
  --info:#4b6584; --info-bg:rgba(75,101,132,.10); --info-line:rgba(75,101,132,.4);
  --s1:#2a78d6; --s2:#eb6834;
  --grid:#e8ebef; --axis:#c4cad2; --band:rgba(9,105,218,.07);
  --shadow:0 8px 24px rgba(20,30,45,.14);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--sans)}
.app{min-height:100vh;overflow-x:clip;position:relative}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-48px;z-index:100;background:var(--card);color:var(--fg);padding:8px 12px;border-radius:6px;border:1px solid var(--line-2)}
.skip:focus{top:8px}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.92em;background:var(--card-2);padding:0 4px;border-radius:4px;border:1px solid var(--line);overflow-wrap:anywhere}
.i{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.i .if{fill:currentColor;stroke:none}
.mono{font-family:var(--mono);font-size:.92em}
.num{text-align:right}
.tnum,.num,.tbl{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.fg2{color:var(--fg-2)}
.small{font-size:11.5px}
.grow{flex:1}
.nowrap{white-space:nowrap}
.err{color:var(--crit)}

/* ---------------------------------------------------------------- top bar */
.top{background:var(--bg-top);border-bottom:1px solid var(--line);-webkit-backdrop-filter:saturate(1.2) blur(8px);backdrop-filter:saturate(1.2) blur(8px)}
@media (min-width:900px){.top{position:sticky;top:0;z-index:30}}
.top-in{max-width:var(--maxw);margin:0 auto;padding:10px 20px 0}
.row1{display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand h1{font-size:15px;line-height:1.2;margin:0;font-weight:650;letter-spacing:.01em}
.brand p{margin:0;font-size:11.5px;color:var(--muted)}
.logo{width:28px;height:28px;flex:none}
.logo .lat{fill:var(--line-2)}
.logo .dop{fill:var(--run)}
.logo .frame{fill:none;stroke:var(--line-2);stroke-width:1.2}
.clocks,.cds{display:flex;gap:18px}
.clk,.cd{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.clk .val,.cd .val{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap}
.clk .day{font-size:11px;color:var(--fg-2);white-space:nowrap}
.cd.t-warn .val{color:var(--warn)}
.cd.t-crit .val{color:var(--crit)}
.actions{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--card);color:var(--fg);cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn[disabled]{opacity:.7;cursor:progress}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn.busy .i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row2{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;margin-top:9px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.pills li.pill-sum{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--fg);cursor:pointer;white-space:nowrap;max-width:100%}
.pill:hover{border-color:var(--line-2);background:var(--hover)}
.pill .k{color:var(--muted)}
.pill .v{font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:currentColor}
.t-ok.dot{color:var(--ok)}.t-run.dot{color:var(--run)}.t-warn.dot{color:var(--warn)}.t-crit.dot{color:var(--crit)}
.t-idle.dot{color:var(--idle)}.t-info.dot{color:var(--info)}.t-muted.dot{color:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.fresh{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fresh b{color:var(--fg-2);font-weight:600}
.fresh b.age-warn{color:var(--warn)}.fresh b.age-crit{color:var(--crit)}
.msg{font-size:12.5px;margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.msg:empty{display:none}
.msg.t-ok{color:var(--ok)}.msg.t-warn{color:var(--warn)}.msg.t-crit{color:var(--crit)}.msg.t-idle{color:var(--fg-2)}
.msg .i{margin-top:2px}
.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.tabs.fade-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.tabs.fade-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px);mask-image:linear-gradient(90deg,transparent,#000 36px)}
.tabs.fade-l.fade-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:inline-flex;align-items:center;gap:7px;padding:9px 12px 10px;border:0;background:none;color:var(--fg-2);font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.badge.t-crit{background:var(--crit-bg);color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit-line)}
.badge.t-warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line)}

/* ---------------------------------------------------------------- banner + alerts */
.wrapx{max-width:var(--maxw);margin:0 auto;padding:0 20px}
#banner:empty{display:none}
#banner{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.bn{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--card);font-size:13px}
.bn .i{width:16px;height:16px;margin-top:1px}
.bn.t-crit{background:var(--crit-bg);border-color:var(--crit-line)}.bn.t-crit>.i{color:var(--crit)}
.bn.t-warn{background:var(--warn-bg);border-color:var(--warn-line)}.bn.t-warn>.i{color:var(--warn)}
.alerts{margin-top:12px}
.al-box{background:var(--card);border:1px solid var(--line);border-radius:8px}
.al-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px}
.al-bar h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;margin:0 4px 0 0;color:var(--fg-2);font-weight:650}
.al-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.al{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px;align-items:start;padding:7px 12px;border-bottom:1px solid var(--line)}
.al>div:first-child .chip{min-width:62px}
.al:last-child{border-bottom:0}
.al.sev-crit{background:linear-gradient(90deg,var(--crit-bg),transparent 70%)}
.al-text{overflow-wrap:anywhere}
.src{font-family:var(--mono);font-size:11px;color:var(--fg-2);background:var(--card-2);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;cursor:pointer;line-height:17px}
.src:hover{border-color:var(--line-2);color:var(--fg)}
.new{font-size:10px;font-weight:700;color:var(--run);margin-left:6px;letter-spacing:.05em;text-transform:uppercase}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 4px;font-size:12px;font-weight:600}
.linkbtn:hover{text-decoration:underline}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--fg-2);cursor:pointer;user-select:none}
.tog input{margin:0;accent-color:var(--accent)}

/* ---------------------------------------------------------------- layout */
main{max-width:var(--maxw);margin:0 auto;padding:4px 20px 28px}
main:focus{outline:none}
.panel{padding-top:10px}
.ph{display:flex;align-items:baseline;gap:4px 14px;flex-wrap:wrap;margin:6px 0 12px}
.ph h2{font-size:17px;margin:0;font-weight:650;letter-spacing:.005em}
.ph .sub{margin:0;color:var(--muted);font-size:12.5px}
.ph .env{margin-left:auto;font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;margin-bottom:12px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1180px){.c4,.c5,.c7,.c8{grid-column:span 12}.c3{grid-column:span 6}}
@media (max-width:760px){.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;margin-bottom:10px}
.card-h h3{margin:0;font-size:11.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-2)}
.card-h .meta{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card p{margin:0 0 8px}
.card > :last-child{margin-bottom:0}
.sub-h{font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.empty{color:var(--muted);font-style:normal;padding:6px 0;margin:0}
.notice{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:6px;font-size:12.5px;margin-bottom:12px;border:1px solid var(--line-2);background:var(--card-2)}
.notice.t-warn{background:var(--warn-bg);border-color:var(--warn-line)}.notice.t-warn>.i{color:var(--warn)}
.notice.t-crit{background:var(--crit-bg);border-color:var(--crit-line)}.notice.t-crit>.i{color:var(--crit)}
.notice.t-idle>.i{color:var(--idle)}
.row-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}

/* ---------------------------------------------------------------- KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;margin-bottom:12px}
.kpi{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px 12px;min-width:0}
.kpi:hover{border-color:var(--line-2);background:var(--hover)}
.kpi .l{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:22px;font-weight:620;line-height:1.2;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.kpi .v small{font-size:12px;font-weight:500;color:var(--fg-2);letter-spacing:0}
.kpi .s{font-size:12px;color:var(--fg-2)}
.kpi .x{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.spark{display:block;width:100%;height:26px;margin-top:4px}
.spark path{fill:none;stroke-width:1.5;stroke-linejoin:round}
.sbar{display:flex;gap:2px;height:7px;border-radius:3px;overflow:hidden;margin-top:6px}
.sb{display:block;height:100%}
.sb.t-ok{background:var(--ok)}.sb.t-run{background:var(--run)}.sb.t-idle{background:var(--idle)}
.sb.t-warn{background:var(--warn)}.sb.t-crit{background:var(--crit)}
.meter{height:6px;background:var(--card-2);border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);margin-top:6px}
.meter>span{display:block;height:100%;background:var(--s1);border-radius:0 3px 3px 0}
.meter.big{height:10px}
.meter.t-warn>span{background:var(--warn)}.meter.t-crit>span{background:var(--crit)}
.meter.t-run>span{background:var(--run)}.meter.t-ok>span{background:var(--ok)}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:6px}
.stat{display:flex;flex-direction:column}
.stat-v{font-size:20px;font-weight:620;line-height:1.2}
.stat-l{font-size:11.5px;color:var(--muted);display:flex;gap:5px;align-items:center}

/* ---------------------------------------------------------------- chips */
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px 0 5px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent;vertical-align:middle;line-height:1;max-width:100%}
.chip>span{overflow:hidden;text-overflow:ellipsis}
.chip .i{width:12px;height:12px}
.chip.t-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.chip.t-run{color:var(--run);background:var(--run-bg);border-color:var(--run-line)}
.chip.t-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.chip.t-crit{color:var(--crit);background:var(--crit-bg);border-color:var(--crit-line)}
.chip.t-idle{color:var(--idle);background:var(--idle-bg);border-color:var(--idle-line)}
.chip.t-info{color:var(--info);background:var(--info-bg);border-color:var(--info-line)}
.chip.t-muted{color:var(--muted);background:transparent;border-color:var(--line-2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}

/* ---------------------------------------------------------------- tables */
.fbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:8px}
.fbar .count{font-size:12px;color:var(--muted);margin-left:auto}
.inp{height:28px;padding:0 9px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0;font-size:12.5px}
input[type=search].inp{width:min(280px,100%)}
select.inp{padding-right:6px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:0 10px;height:26px;cursor:pointer;color:var(--fg-2);font-size:12px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--run-bg);color:var(--fg);font-weight:650}
.seg button:hover{color:var(--fg)}
.tw{position:relative;overflow:auto;border:1px solid var(--line);border-radius:6px;max-width:100%}
.tw.tall{max-height:560px}
.tw.mid{max-height:380px}
.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
.tbl th,.tbl td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl thead th{position:sticky;top:0;z-index:2;background:var(--card-2);color:var(--fg-2);font-size:11.5px;font-weight:600;white-space:nowrap;vertical-align:bottom}
.tbl tbody th{font-weight:500}
.tbl tbody tr:last-child>*{border-bottom:0}
.tbl tbody tr:hover>*{background:var(--hover)}
.tbl .num{text-align:right}
.tbl td.wrap,.tbl th.wrap{white-space:normal;min-width:220px}
.tbl td.wide{min-width:320px}
.tbl tr.grp>th{background:var(--card-2);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650;padding-top:6px;padding-bottom:5px}
.tbl tr.row-warn>*{background:var(--warn-bg)}
.tbl tr.row-crit>*{background:var(--crit-bg)}
.tbl tr.row-muted>*{color:var(--muted)}
.th-btn{display:inline-flex;align-items:center;gap:3px;border:0;background:none;padding:0;color:inherit;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
th.num .th-btn{flex-direction:row-reverse}
.th-btn:hover{color:var(--fg)}
.sort-ind{display:inline-flex;width:12px}
.sort-ind .i{width:12px;height:12px}
.tbl .cellnote{display:block;font-size:11px;color:var(--muted)}
.flag{display:flex;gap:4px;align-items:flex-start;font-size:11px;color:var(--warn);margin-top:2px}
.flag .i{width:12px;height:12px;margin-top:1px}
.stage{display:inline-flex;gap:6px;align-items:center}

/* ---------------------------------------------------------------- swimlane */
.swim th,.swim td{padding:4px 6px;vertical-align:middle}
.swim th.name{font-family:var(--mono);font-size:11.5px;white-space:nowrap;font-weight:500;position:sticky;left:0;z-index:1;background-color:var(--card)}
.swim thead th:first-child{left:0;z-index:3}
.swim tr.row-crit>th.name{background:linear-gradient(var(--crit-bg),var(--crit-bg)),var(--card)}
.swim tbody tr:hover>th.name{background:var(--hover)}
.swim td.wrap{min-width:150px}
.st{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:30px;height:20px;padding:0 5px;border-radius:4px;font-size:10.5px;font-weight:650;border:1px solid transparent;font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:middle}
.st .i{width:11px;height:11px}
.st-done{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.st-cont{color:var(--ok);border-color:var(--ok-line)}
.st-run{color:var(--run);background:var(--run-bg);border-color:var(--run-line);animation:pulse 2.4s ease-in-out infinite}
.st-queued{color:var(--idle);border:1px dashed var(--idle-line)}
.st-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.st-fail{color:var(--crit);background:var(--crit-bg);border-color:var(--crit-line)}
.st-na{color:var(--muted);border-color:transparent}
.st-pend{border:1px dashed var(--idle-line);color:var(--idle)}
.st-slot{border:1px dotted var(--line);opacity:.6}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--run-bg)}50%{box-shadow:0 0 0 3px var(--run-bg)}}
.segs{display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.retry{font-size:11px;color:var(--warn);margin-left:4px;white-space:nowrap}
.na-text{font-size:11.5px;color:var(--muted);font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--fg-2);margin:0 0 8px;align-items:center}
.legend .item{display:inline-flex;align-items:center;gap:5px}
.legend .st{min-width:22px;height:16px;padding:0 3px;animation:none}
.lk{display:inline-block;width:14px;height:3px;border-radius:2px}
.bk{display:inline-block;width:12px;height:10px;background:var(--band);border:1px solid var(--run-line);border-radius:2px}

/* ---------------------------------------------------------------- charts */
.chart{position:relative;width:100%;min-height:40px;border-radius:4px}
.chart:focus-visible{outline-offset:4px}
.chart-svg{display:block;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--axis);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10.5px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.chart .axl{fill:var(--muted);font-size:10.5px;font-family:var(--sans)}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .band{fill:var(--band)}
.chart .end,.chart .hdot{stroke:var(--card);stroke-width:2}
.chart .endlab{fill:var(--fg-2);font-size:11px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.chart .xhair{stroke:var(--line-2);stroke-width:1}
.chart .ov{fill:transparent;cursor:crosshair}
.tt{position:absolute;z-index:5;pointer-events:none;background:var(--card-2);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;font-size:11.5px;box-shadow:var(--shadow);white-space:nowrap;font-variant-numeric:tabular-nums}
.tt-h{color:var(--fg-2);margin-bottom:3px}
.tt-row{display:flex;align-items:center;gap:6px}
.tt-v{margin-left:auto;padding-left:12px;font-weight:650}
.sw{display:inline-block;width:10px;height:3px;border-radius:2px}

/* ---------------------------------------------------------------- misc widgets */
.kv{display:grid;grid-template-columns:minmax(96px,max-content) minmax(0,1fr);gap:5px 14px;margin:0;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.gauge{display:flex;gap:2px;height:12px;margin:6px 0 4px}
.gz{position:relative;background:var(--card-2);border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);min-width:6px}
.gz.res{background:repeating-linear-gradient(135deg,var(--card-2) 0 3px,var(--line) 3px 4px)}
.gf{height:100%;background:var(--s1);border-radius:0 3px 3px 0}
.gf.res{background:var(--s2)}
.gf.over{background:var(--crit)}
.glab{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--fg-2)}
.glab .item{display:inline-flex;gap:5px;align-items:center}
.gsw{display:inline-block;width:10px;height:10px;border-radius:2px}
.cbar{display:flex;gap:2px;height:14px;margin:4px 0 6px}
.cseg{position:relative;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);border-radius:3px;overflow:hidden;min-width:4px}
.cseg>.f{position:absolute;top:0;bottom:0;left:0;background:var(--ok)}
.cseg>.x{position:absolute;top:0;bottom:0;background:var(--crit)}
.cseg.next{box-shadow:inset 0 0 0 1.5px var(--run)}
.cseg.active{box-shadow:inset 0 0 0 1.5px var(--warn)}
.stg-mini{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--fg-2)}
.stg-mini span{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;list-style:none;margin:10px 0 0;padding:0}
.step{border:1px solid var(--line);border-left-width:3px;border-radius:6px;padding:7px 9px;background:var(--card-2);min-width:0}
.step .sh{display:flex;align-items:center;gap:6px}
.step .sid{font-weight:700;font-size:13px}
.step .sname{font-size:11.5px;color:var(--fg-2);margin:2px 0 3px;line-height:1.3}
.step .sc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.step.s-done{border-left-color:var(--ok)}.step.s-done .sh .i{color:var(--ok)}
.step.s-warn{border-left-color:var(--warn)}.step.s-warn .sh .i{color:var(--warn)}
.step.s-active{border-left-color:var(--run)}.step.s-active .sh .i{color:var(--run)}
.step.s-next{border-left-color:var(--run);border-style:solid dashed dashed solid}.step.s-next .sh .i{color:var(--run)}
.step.s-plan{border-left-color:var(--line-2)}.step.s-plan .sh .i{color:var(--idle)}
.hbars{display:grid;grid-template-columns:minmax(64px,max-content) minmax(40px,1fr) max-content;gap:4px 10px;align-items:center;font-size:12px}
.hbars .tr{height:8px}
.hbars .fl{height:8px;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.hbars .hv{font-variant-numeric:tabular-nums;color:var(--fg-2);text-align:right}
.hgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 28px}
.dl-track{position:relative;height:44px;margin:4px 10px 2px}
.dl-bar{position:absolute;left:0;right:0;top:17px;height:4px;background:var(--card-2);border-radius:2px;box-shadow:inset 0 0 0 1px var(--line)}
.dl-past{position:absolute;left:0;top:17px;height:4px;background:var(--line-2);border-radius:2px}
.dl-now{position:absolute;top:6px;height:26px;width:2px;margin-left:-1px;background:var(--run);border-radius:1px}
.dl-mk{position:absolute;top:10px;width:18px;height:18px;margin-left:-9px;border-radius:50%;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--card);border:1.5px solid var(--idle);color:var(--fg)}
.dl-mk.t-warn{border-color:var(--warn);color:var(--warn)}.dl-mk.t-crit{border-color:var(--crit);color:var(--crit)}.dl-mk.t-muted{border-color:var(--line-2);color:var(--muted)}
.dl-day{position:absolute;top:30px;font-size:10px;color:var(--muted);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.dls{list-style:none;margin:8px 0 0;padding:0}
.dls li{display:grid;grid-template-columns:22px minmax(0,1fr) max-content;gap:8px;align-items:start;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}
.dls li.past{color:var(--muted)}
.dl-n{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;border:1.5px solid var(--idle);margin-top:1px}
.dl-n.t-warn{border-color:var(--warn);color:var(--warn)}.dl-n.t-crit{border-color:var(--crit);color:var(--crit)}.dl-n.t-muted{border-color:var(--line-2);color:var(--muted)}
.dl-l{display:flex;flex-direction:column;min-width:0}
.dl-l .muted{font-size:11.5px}
.dl-c{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{list-style:none;margin:0;padding:0}
.acts li{display:grid;grid-template-columns:14px minmax(0,1fr) max-content;gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.acts li:first-child{border-top:0}
.acts .dot{margin-top:5px}
.acts .tx{overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.tl>li:first-child{border-top:0;padding-top:2px}
.tl-time{font-variant-numeric:tabular-nums;color:var(--fg-2);font-size:12px;display:flex;flex-direction:column}
.tl-time .muted{font-size:11px}
.tl-topic{font-weight:600;margin-bottom:3px}
.tl-meta{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.tl-verdict{font-size:12.5px;color:var(--fg-2)}
.tl-dec{margin-top:7px;padding:6px 9px;border-radius:6px;background:var(--card-2);border:1px solid var(--line);font-size:12px;color:var(--fg-2)}
.tl-dec.pending{background:var(--warn-bg);border-color:var(--warn-line);color:var(--fg)}
.tl-dec.pending .i{color:var(--warn)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.hcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.hc-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hid{font-family:var(--mono);font-weight:700;font-size:12.5px}
.ht{font-weight:600;line-height:1.35}
.hm{font-size:11.5px;color:var(--muted)}
.hf{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--fg-2)}
.hf span{display:inline-flex;align-items:center;gap:4px}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;padding:4px 0;font-size:12.5px}
.checklist li .i{margin-top:2px}
.checklist li.done{color:var(--fg-2)}.checklist li.done .i{color:var(--ok)}
.checklist li.open .i{color:var(--idle)}
.repl{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.repl:first-of-type{border-top:0}
.repl .arrow{color:var(--muted);margin-top:2px}
.repl .nm{font-family:var(--mono);font-weight:600;font-size:12px;margin-right:6px}
.repl ul{margin:4px 0 0;padding-left:16px;font-size:12px;color:var(--fg-2)}
.ab{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:980px){.ab{grid-template-columns:minmax(0,1fr)}}
.ab-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;margin-bottom:8px}
.ab-prog{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ab-prog .meter{flex:1;margin:0}
.banner-card.t-run{border-color:var(--run-line)}
.banner-card.t-crit{border-color:var(--crit-line);background:linear-gradient(180deg,var(--crit-bg),var(--card) 60%)}
.banner-card.t-warn{border-color:var(--warn-line)}
.idle-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
details.dt{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
details.dt>summary{cursor:pointer;color:var(--fg-2);font-size:12px;font-weight:600;padding:2px 0}
details.dt>summary:hover{color:var(--fg)}
details.dt[open]>summary{margin-bottom:8px}
.rules{margin:0;padding-left:18px;font-size:12.5px;color:var(--fg-2)}
.rules li{margin:3px 0}
.expect{border-left:2px solid var(--run-line);padding:2px 0 2px 8px;margin-top:4px;color:var(--fg-2);font-size:12px}
.entries{list-style:none;margin:0;padding:0}
.entries>li{padding:8px 0;border-top:1px solid var(--line)}
.entries>li:first-child{border-top:0;padding-top:0}
.eh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.verd{padding:8px 0;border-top:1px solid var(--line)}
.verd:first-child{border-top:0;padding-top:0}
.verd .vt{margin:4px 0 2px;overflow-wrap:anywhere}
.verd .vm{font-size:11.5px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.foot{max-width:var(--maxw);margin:0 auto;padding:14px 20px 32px;color:var(--muted);font-size:11.5px;border-top:1px solid var(--line);display:flex;gap:6px 20px;flex-wrap:wrap}

@media (max-width:640px){
  .top-in,.wrapx,main,.foot{padding-left:16px;padding-right:16px}
  .brand p,.clk .day{display:none}
  .cds .cd.end{display:none}
  .pills li.okp{display:none}
  .pills.all li.okp{display:block}
  .pills li.pill-sum{display:block}
  .clocks,.cds{gap:14px}
  .fresh{margin-left:0;width:100%}
  .clk .val,.cd .val{font-size:14px}
  .kpis{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .kpi .v{font-size:19px}
  .tl>li{grid-template-columns:1fr;gap:4px}
  .tl-time{flex-direction:row;gap:8px}
  .al{grid-template-columns:minmax(0,1fr);gap:4px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (forced-colors:active){.st,.chip,.badge,.pill{border:1px solid CanvasText}.dot,.meter>span,.gf,.sb,.cseg>.f,.cseg>.x{forced-color-adjust:none}}
@media (max-width:899.98px){.top{position:sticky;top:var(--stick,0px);z-index:30}}
</style>

<a class="skip" href="#main">Skip to content</a>
<div class="app">
<header class="top">
  <div class="top-in">
    <div class="row1">
      <div class="brand">
        <svg class="logo" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
          <rect class="frame" x="0.6" y="0.6" width="26.8" height="26.8" rx="6"/>
          <circle class="lat" cx="8" cy="8" r="2.2"/><circle class="lat" cx="14" cy="8" r="2.2"/><circle class="lat" cx="20" cy="8" r="2.2"/>
          <circle class="lat" cx="8" cy="14" r="2.2"/><circle class="dop" cx="14" cy="14" r="3.2"/><circle class="lat" cx="20" cy="14" r="2.2"/>
          <circle class="lat" cx="8" cy="20" r="2.2"/><circle class="lat" cx="14" cy="20" r="2.2"/><circle class="lat" cx="20" cy="20" r="2.2"/>
        </svg>
        <div>
          <h1>IWO Mission Control</h1>
          <p>W-doped In<sub>2</sub>O<sub>3</sub> TFT &middot; ATLAS C10 &middot; QE + MACE on lxplus &middot; Codex monitor</p>
        </div>
      </div>
      <div class="clocks" role="group" aria-label="Server clock">
        <div class="clk"><span class="lbl">UTC</span><span class="val" id="clk-utc">--:--:--</span><span class="day" id="clk-utc-d">&nbsp;</span></div>
        <div class="clk"><span class="lbl" id="clk-loc-tz">Local</span><span class="val" id="clk-loc">--:--:--</span><span class="day" id="clk-loc-d">&nbsp;</span></div>
      </div>
      <div class="cds" id="countdowns" role="group" aria-label="Countdowns"></div>
      <div class="actions">
        <button type="button" class="btn" id="btn-refresh" title="Re-run the local collectors and query CERN now (the server allows one manual CERN query every 2 min)"></button>
        <button type="button" class="btn icon" id="btn-theme"></button>
      </div>
    </div>
    <div class="row2">
      <ul class="pills" id="pills" aria-label="Health"></ul>
      <div class="fresh" id="fresh" role="group" aria-label="Data freshness"></div>
    </div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  </div>
</header>
<div class="wrapx" id="banner"></div>
<section class="wrapx alerts" id="alerts" aria-labelledby="alerts-h"></section>
<main id="main" tabindex="-1">
  <section class="panel" id="p-overview" role="tabpanel" aria-labelledby="tab-overview" hidden></section>
  <section class="panel" id="p-cern" role="tabpanel" aria-labelledby="tab-cern" hidden></section>
  <section class="panel" id="p-ml" role="tabpanel" aria-labelledby="tab-ml" hidden></section>
  <section class="panel" id="p-atlas" role="tabpanel" aria-labelledby="tab-atlas" hidden></section>
  <section class="panel" id="p-codex" role="tabpanel" aria-labelledby="tab-codex" hidden></section>
  <section class="panel" id="p-ledger" role="tabpanel" aria-labelledby="tab-ledger" hidden></section>
</main>
<footer class="foot" id="foot"></footer>
</div>
<div class="sr-only" id="announce" aria-live="polite"></div>
<script>
(function () {
'use strict';

/* ================================================================================== config */
var POLL_MS = 30000;
var STATUS_TIMEOUT_MS = 25000;
var REFRESH_TIMEOUT_MS = 90000;
var LS_KEY = 'iwo-mission-control/ui/v1';
var TABS = [
  {id: 'overview', label: 'Overview', src: ['meta']},
  {id: 'cern', label: 'CERN DFT', src: ['cern']},
  {id: 'ml', label: 'ML structures', src: ['ml']},
  {id: 'atlas', label: 'ATLAS C10', src: ['atlas']},
  {id: 'codex', label: 'Codex & register', src: ['codex', 'register']},
  {id: 'ledger', label: 'Ledger & git', src: ['ledger', 'git', 'server']}
];
var SRC_TAB = {meta: 'overview', cern: 'cern', ml: 'ml', atlas: 'atlas', codex: 'codex', register: 'codex',
  ledger: 'ledger', git: 'ledger', server: 'ledger', alerts: 'overview'};
var COLLECTORS = ['atlas', 'cern', 'ml', 'codex', 'register', 'ledger', 'git', 'meta'];
var SEV_RANK = {crit: 0, warn: 1, info: 2};
function sevRank(a) { var r = SEV_RANK[a && a.severity]; return r == null ? 9 : r; }  /* crit is 0, so never `|| 9` */
/* Collectors whose DATA each panel shows (a panel is re-rendered only when one of them changed; see panelSig) */
var TAB_DEPS = {overview: ['cern', 'ml', 'atlas', 'codex', 'register', 'ledger', 'git', 'meta'], cern: ['cern'], ml: ['ml'],
  atlas: ['atlas'], codex: ['codex', 'register'], ledger: ['ledger', 'git']};
/* Keys that change on every collection without a visible change (shown times tick from absolute epochs) */
var VOLATILE = {age_s: 1, sec: 1, duration_s: 1, updated_epoch: 1, updated_utc: 1, next_wake_in_s: 1, next_due_in_s: 1,
  remaining_s: 1, server_time_utc: 1, server_epoch: 1, server_time_local: 1, qc_source_age_s: 1, last_active_age_s: 1,
  timeout_remaining_s: 1, status_s: 1, seconds: 1, snapshot_age_s: 1, uptime_s: 1, cern_next_auto_in_s: 1,
  master_check_s: 1, generated_epoch: 1, generated_utc: 1};
var ATLAS_TONE = {IDLE: 'idle', RUNNING: 'run', FINISHING: 'run', BETWEEN_LAUNCHES: 'info', STALE: 'crit', SOLVER_UNTRACKED: 'warn'};
var ATLAS_WORD = {IDLE: 'Idle', RUNNING: 'Running', FINISHING: 'Finishing', BETWEEN_LAUNCHES: 'Between launches',
  STALE: 'Stale run', SOLVER_UNTRACKED: 'Untracked solver'};
var FAM = {aIO: 'a-IO · undoped In₂O₃', aIWO: 'a-IWO · W-doped In₂O₃'};
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

/* ================================================================================== persisted UI state */
var DEFAULT_UI = {
  tab: 'overview', theme: 'auto', alertsOpen: false, alertsInfo: true,
  f: {swimAll: true, cernQ: '', cernFam: 'all', cernState: 'all', mlQ: '', mlQc: 'all', runsQ: '', runsC10: true,
      decQ: '', decStatus: 'all', taskQ: '', taskStatus: 'all', histView: 'queue', histRange: '24h', jobsKind: 'all'},
  sort: {}, open: {}
};
function loadUi() {
  var o = null;
  try { o = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { o = null; }

function tick() {
  if (document.hidden) return;
  var n = nowS(), off = tzOffsetMin(), i, el, els;
  $('clk-utc').textContent = fmtHMS(n, 0);
  $('clk-utc-d').textContent = fmtDay(n, 0);
  $('clk-loc').textContent = fmtHMS(n, off);
  $('clk-loc-d').textContent = fmtDay(n, off);
  els = document.querySelectorAll('[data-ago]');
  for (i = 0; i < els.length; i++) { el = els[i]; el.textContent = (el.getAttribute('data-pre') || '') + fmtAgo(n - parseFloat(el.getAttribute('data-ago'))); }
  els = document.querySelectorAll('[data-until]');
  for (i = 0; i < els.length; i++) { el = els[i]; el.textContent = untilText(parseFloat(el.getAttribute('data-until')) - n, el.getAttribute('data-mode'), el.getAttribute('data-zero')); }
  els = document.querySelectorAll('[data-since]');
  for (i = 0; i < els.length; i++) { el = els[i]; el.textContent = fmtDur(n - parseFloat(el.getAttribute('data-since'))); }
  if (S.msg && S.msg.until && n > S.msg.until) setMsg(null);
  if (S.deferPanel) renderPanel(ui.tab);  /* a deferred re-render runs once the selection / hover / select is gone */
}

/* ================================================================================== init */
function init() {
  buildTabs();
  applyTheme();
  $('btn-refresh').addEventListener('click', doRefresh);
  $('btn-theme').addEventListener('click', cycleTheme);
  var hid = location.hash.slice(1);
  if (TABS.some(function (t) { return t.id === hid; })) ui.tab = hid;
  window.addEventListener('hashchange', function () {
    var id = location.hash.slice(1);
    if (TABS.some(function (t) { return t.id === id; }) && id !== ui.tab) switchTab(id);
  });
  if (typeof ResizeObserver === 'function') resizeObs = new ResizeObserver(onResize);
  $('tabs').addEventListener('scroll', updateTabFade, {passive: true});
  window.addEventListener('resize', function () { updateTabFade(); updateStick(); });
  if (window.matchMedia) { var mq = matchMedia('(prefers-color-scheme: light)'); if (mq.addEventListener) mq.addEventListener('change', applyTheme); }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { clearTimeout(S.timer); S.timer = 0; return; }
    tick();
    if (S.online === false || Date.now() - S.recvAt >= POLL_MS - 1000) poll(); else schedule(POLL_MS - (Date.now() - S.recvAt));
  });
  document.addEventListener('focusout', function () {
    if (!S.deferPanel) return;
    setTimeout(function () { var ae = document.activeElement; if (S.deferPanel && !(ae && ae.tagName === 'SELECT')) renderPanel(ui.tab); }, 0);
  });
  showPanel(ui.tab);
  renderAll();
  revealTab(ui.tab);
  tick();
  setInterval(tick, 1000);
  poll();
}
init();
})();
</script>
