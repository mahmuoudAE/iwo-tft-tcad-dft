  caveats: "Crystalline cells only. PBE only, no HSE for the W cells. The level positions above the host CB bottom at Gamma (1.22 at 1 nm, 1.34 at 2 nm, 1.76 bulk 24d, 1.80 eV bulk 8b) are computed at one filling only: 3 donated electrons per cell (1.4e21-3e21 cm^-3), E_F 1.2-1.8 eV inside the host CB. In every cell the W-5d-rich level lies roughly 0.1 eV or less from E_F at Gamma (2 nm +0.103 eV); this does not describe the whole dispersive band. The near-E_F placement is COMPUTED; pinning of the level by the band filling is an interpretation that needs a density series. The W-5d counts are Loewdin projections of occupied above-VB states, not the total W charge or a uniquely defined trapped-electron fraction; MV occupations are numerical smearing weights. That the level stays above E_C at device densities (E_F below E_C) is INFERRED, not computed (no lower-density cell)."
